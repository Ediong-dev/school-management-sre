apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: school
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ediong-dev/school-management-sre
    targetRevision: main
    path: k8s/overlays/gitops
  destination:
    server: https://kubernetes.default.svc
    namespace: school
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false