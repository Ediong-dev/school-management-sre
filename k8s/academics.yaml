---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: academics
  namespace: school
  labels:
    app: academics
spec:
  replicas: 2
  selector:
    matchLabels:
      app: academics
  template:
    metadata:
      labels:
        app: academics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: academics
          image: school-academics:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: ACADEMICS_FAILURE_RATE
              value: "0"
            - name: ACADEMICS_LATENCY_MS
              value: "0"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: academics
  namespace: school
  labels:
    app: academics
spec:
  type: ClusterIP
  selector:
    app: academics
  ports:
    - name: http
      port: 3002
      targetPort: http
      protocol: TCP