apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: school-slo-alerts
  namespace: school
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: school_slo_burn_rate
      interval: 30s
      rules:
        # Fast burn: 14.4x over 5m AND 1h means we'll exhaust the
        # 30-day error budget in ~2 days. This pages.
        - alert: SchoolSLOFastBurn
          expr: |
            (
              school:http_error_ratio:rate5m > (14.4 * 0.001)
              and
              school:http_error_ratio:rate1h > (14.4 * 0.001)
            )
          for: 2m
          labels:
            severity: critical
            namespace: school
            slo: availability_99_9
          annotations:
            summary: "{{ $labels.service }} is burning error budget fast"
            description: |
              Service {{ $labels.service }} has an error ratio above
              14.4x the 99.9% SLO target for both the 5m and 1h windows.
              At this rate the 30-day error budget will be exhausted
              in ~2 days. Runbook: docs/runbooks/README.md#fastburn
            dashboard: "https://grafana.local/d/school-golden"

        # Slow burn: 6x over 30m AND 6h means we'll exhaust the
        # 30-day error budget in ~5 days. This is a ticket, not a page.
        - alert: SchoolSLOSlowBurn
          expr: |
            (
              school:http_error_ratio:rate30m > (6 * 0.001)
              and
              school:http_error_ratio:rate6h > (6 * 0.001)
            )
          for: 15m
          labels:
            severity: warning
            namespace: school
            slo: availability_99_9
          annotations:
            summary: "{{ $labels.service }} is trending toward SLO violation"
            description: |
              Service {{ $labels.service }} has an error ratio above
              6x the 99.9% SLO target over both 30m and 6h windows.
              At this rate the error budget will be exhausted in ~5 days.
              Runbook: docs/runbooks/README.md#slowburn
            dashboard: "https://grafana.local/d/school-golden"

        # Latency SLO alert: P95 above 500ms for 10 minutes.
        - alert: SchoolHighLatencyP95
          expr: |
            school:http_latency_p95:rate5m > 0.5
          for: 10m
          labels:
            severity: warning
            namespace: school
            slo: latency_p95_500ms
          annotations:
            summary: "{{ $labels.service }} P95 latency > 500ms"
            description: |
              Service {{ $labels.service }} P95 latency is {{ $value | humanizeDuration }}
              over 5m, exceeding the 500ms SLO target.
            runbook: "docs/runbooks/README.md#highlatency"