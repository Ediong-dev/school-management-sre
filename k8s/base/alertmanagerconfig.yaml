apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: school-alerts
  namespace: school
  labels:
    release: kube-prometheus-stack
spec:
  route:
    receiver: 'null'
    groupBy: ['alertname', 'service']
    groupWait: 10s
    groupInterval: 30s
    repeatInterval: 1h
    routes:
      # Only SLO alerts from the school namespace go to Discord.
      - matchers:
          - name: namespace
            value: school
          - name: severity
            value: critical
        receiver: 'discord'
        continue: true
      - matchers:
          - name: namespace
            value: school
          - name: severity
            value: warning
        receiver: 'discord'
  receivers:
    - name: 'null'
    - name: 'discord'
      discordConfigs:
        - apiURL:
            name: alertmanager-discord
            key: webhook-url
          sendResolved: true
          title: |
            {{ if eq .Status "firing" }}🔥 FIRING{{ else }}✅ RESOLVED{{ end }}: {{ .CommonLabels.alertname }}
          message: |
            {{ range .Alerts }}
            **Service:** {{ .Labels.service }}
            **Severity:** {{ .Labels.severity }}
            **Summary:** {{ .Annotations.summary }}
            **Description:** {{ .Annotations.description }}
            {{ end }}
# IMPORTANT: The secret `alertmanager-discord` must exist in the SAME namespace
# as this AlertmanagerConfig (i.e., `school`). The Prometheus Operator resolves
# secret references relative to the AlertmanagerConfig's namespace, not the
# Alertmanager's namespace. Creating the secret in `monitoring` will cause the
# operator to skip this config with a "secret not found" error.
