global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: school-management-sre
    environment: local

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ['gateway:3000']

  - job_name: auth
    metrics_path: /metrics
    static_configs:
      - targets: ['auth:3001']

  - job_name: academics
    metrics_path: /metrics
    static_configs:
      - targets: ['academics:3002']

  - job_name: dashboard
    metrics_path: /metrics
    static_configs:
      - targets: ['dashboard:3003']